<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>ScoreWatch · WSSL MVP</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:#fff;padding:22px max(18px,calc((100vw - 680px)/2))}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#aebbd0;font-size:13px}main{max-width:680px;margin:auto;padding:18px}nav{display:flex;gap:8px;margin-bottom:20px}nav button{flex:1;border:0;border-radius:12px;padding:13px 4px;background:white;font-weight:700;color:#475569}nav button.active{background:#2563eb;color:white}.card{background:white;border-radius:16px;padding:17px;margin-bottom:12px;box-shadow:0 2px 12px #1720330c}.muted{color:#64748b;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.teams{font-weight:700;line-height:1.8;min-width:0}.score{font-size:23px;font-weight:800;white-space:nowrap;text-align:right;line-height:1.8}.tag{font-size:11px;font-weight:800;color:#166534;background:#dcfce7;padding:5px 8px;border-radius:6px;white-space:nowrap}.upcoming{color:#1d4ed8;background:#dbeafe}.division{margin-top:12px;padding-top:11px;border-top:1px solid #e2e8f0;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.division a,a{color:#1d4ed8;font-weight:700;text-decoration:none}.rank{font-weight:700;color:#334155}.follow{border:1px solid #2563eb;background:white;color:#2563eb;border-radius:9px;padding:9px 12px;font-weight:700;white-space:nowrap}.follow.on{background:#2563eb;color:white}h2{font-size:18px;margin:6px 0 16px}.note{background:#fff7ed;color:#9a3412;padding:12px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:15px}label{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #e2e8f0}input[type=checkbox]{width:22px;height:22px}input[type=search]{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;margin-bottom:14px}small{display:block;color:#64748b;margin-top:7px}footer{text-align:center;color:#64748b;font-size:12px;padding:24px}button{cursor:pointer}.empty{padding:12px 0}select,input:not([type=checkbox]),textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:88px}.sub{font-size:12px;color:#64748b;margin-top:8px}</style></head><body><header><h1 id="brand">ScoreWatch</h1><p>WSSL · Your teams. Your scores.</p></header><main><div class="note">V7 real-data preview · Matches are from a GotSport spreadsheet export, not a live feed. For this MVP, any match with both scores posted displays as FINAL. Notifications are not active.</div><nav><button class="active" data-tab="scores">Scores</button><button data-tab="teams">Find Teams</button><button data-tab="settings">Alerts</button></nav><section id="scores"></section><section id="teams" hidden></section><section id="settings" hidden></section></main><footer>ScoreWatch V7 · Snapshot data · Branding configurable</footer><script src="data.js"></script><script>
const d=window.SCOREWATCH_DATA;const base='https://system.gotsport.com/org_event/events/'+d.eventId,divUrl=base+'/results?group='+d.divisionId,teamUrl=base+'/schedules?team='+d.teamId;let fav=JSON.parse(localStorage.getItem('sw-fav-v6')||'[0]');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('sw-fav-v6',JSON.stringify(fav));function divisionInfo(i){const t=d.teams[i];return `<div class="division"><span class="rank">${t.rank}${t.rank===1?'st':t.rank===2?'nd':t.rank===3?'rd':'th'} of ${d.teams.length} teams <span class="muted">· ${t.w}-${t.l}-${t.t} (W-L-T)</span></span><a href="${divUrl}" target="_blank" rel="noopener">Division standings ↗</a></div>`}function card(g){const posted=g.homeScore!==null&&g.awayScore!==null;const label=posted?'FINAL':'SCHEDULED';return `<article class="card"><div class="row"><span class="muted">${new Date(g.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})} · ${esc(g.time)}</span><span class="tag ${posted?'':'upcoming'}">${label}</span></div><div class="row" style="margin-top:12px"><div class="teams">${esc(g.home)}<br>${esc(g.away)}</div><div class="score">${posted?g.homeScore:'–'}<br>${posted?g.awayScore:'–'}</div></div><div class="sub">${esc(g.location)} · Match #${esc(g.id)}${g.sourceStatus==='Rescheduled'?' · GotSport status: Rescheduled':''}</div><div class="division"><span class="muted">${esc(g.division)}</span><a href="${teamUrl}" target="_blank" rel="noopener">Official schedule ↗</a></div></article>`}function renderScores(){const followed=fav.map(i=>({i,name:d.teams[i].name}));const extraFollowed=getExtraTeams();const list=d.games.filter(g=>fav.some(i=>g.home===d.teams[i].name||g.away===d.teams[i].name));const upcoming=list.filter(g=>g.homeScore===null).sort((a,b)=>a.date.localeCompare(b.date));const recent=list.filter(g=>g.homeScore!==null).sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#scores').innerHTML='<h2>My Teams</h2>'+(followed.length?followed.map(({i,name})=>`<div class="card"><div class="row"><div><strong>${esc(name)}</strong><div class="muted">U11 Girls Select Div 2 (9v9)</div></div><a href="${i===0?teamUrl:divUrl}" target="_blank" rel="noopener">WSSL ↗</a></div>${divisionInfo(i)}</div>`).join(''):'<div class="card">No teams followed. Open Find Teams to add favorites.</div>')+extraFollowed.map(t=>`<div class="card"><strong>${esc(t.name)}</strong><div class="muted">${esc(t.division)} · Awaiting schedule import</div><a href="${base}/results?group=${encodeURIComponent(t.divisionId)}" target="_blank" rel="noopener">Division standings ↗</a></div>`).join('')+(upcoming.length?'<h2>Scheduled / awaiting scores</h2>'+upcoming.map(card).join(''):'')+(recent.length?'<h2>Recent final results</h2>'+recent.map(card).join(''):'')+(followed.length&&!list.length?'<div class="card muted">This export only includes Novi Lightning matches. Other followed teams need their own schedule export.</div>':'')+'<p class="muted">Snapshot from user-provided GotSport export. A match without a score may have been played already. Rankings are a separate public standings snapshot; neither updates automatically.</p>'}const CATALOG_KEY='sw-extra-divisions-v7';const EXTRA_TEAMS_KEY='sw-extra-teams-v7';
const getExtraDivisions=()=>{try{return JSON.parse(localStorage.getItem(CATALOG_KEY)||'[]')}catch{return []}};
const getExtraTeams=()=>{try{return JSON.parse(localStorage.getItem(EXTRA_TEAMS_KEY)||'[]')}catch{return []}};
const saveExtraTeams=x=>localStorage.setItem(EXTRA_TEAMS_KEY,JSON.stringify(x));
const isFollowedExternal=(divisionId,name)=>getExtraTeams().some(t=>t.divisionId===divisionId&&t.name===name);
let filterSex='girls',filterDivision=d.divisionId;
function renderTeams(q=''){
 const extras=getExtraDivisions(),sex=filterSex,selected=filterDivision;
 const divisions=[{id:d.divisionId,name:'U11 Girls Select Division 2 (9v9)',sex:'girls',teams:d.teams.map(t=>t.name),verified:true},...extras];
 const visible=divisions.filter(x=>x.sex===sex);const active=visible.find(x=>x.id===selected)||visible[0];
 const main=active?.verified;
 document.querySelector('#teams').innerHTML=`<h2>Find Teams</h2><div class="card"><div class="muted">1 · Choose a league category</div><select id="sex-filter" aria-label="Boys or girls"><option value="girls" ${sex==='girls'?'selected':''}>Girls</option><option value="boys" ${sex==='boys'?'selected':''}>Boys</option></select><div class="muted" style="margin-top:14px">2 · Choose a division</div><select id="division-filter" aria-label="Division">${visible.map(v=>`<option value="${esc(v.id)}" ${active?.id===v.id?'selected':''}>${esc(v.name)}</option>`).join('')||'<option>No divisions added yet</option>'}</select><p class="muted">Only the selected U11 girls division has verified team data so far. To expand coverage, open the WSSL division directory and add a division below.</p><a href="${base}/teams?showall=groups" target="_blank" rel="noopener">Browse all WSSL divisions ↗</a></div><div class="card"><strong>Add a WSSL division</strong><p class="muted">Copy a division results URL from GotSport. Add team names from that page to follow them here. Imported divisions are saved on this device; scores require a data export.</p><form id="add-division"><select name="sex" aria-label="Category"><option value="girls">Girls</option><option value="boys">Boys</option></select><input name="name" placeholder="Division name (e.g. U12 Girls Select 1)" required><input name="url" type="url" placeholder="GotSport division results URL" required><textarea name="teams" placeholder="Team names, one per line (optional)"></textarea><button class="follow" type="submit">Add division</button><div id="form-message" class="muted"></div></form></div><h2>${active?esc(active.name):'Teams'}</h2><input type="search" id="search" placeholder="Search teams in this division" value="${esc(q)}">${active?(main?d.teams.map((t,i)=>({t,i})).filter(x=>x.t.name.toLowerCase().includes(q.toLowerCase())).map(({t,i})=>`<div class="card row"><div><strong>${esc(t.name)}</strong><div class="muted">${t.rank} of ${d.teams.length} · ${t.w}-${t.l}-${t.t} W-L-T</div><a href="${divUrl}" target="_blank" rel="noopener">Division standings ↗</a></div><button class="follow ${fav.includes(i)?'on':''}" data-id="${i}">${fav.includes(i)?'Following':'+ Follow'}</button></div>`).join(''):active.teams.filter(t=>t.toLowerCase().includes(q.toLowerCase())).map(name=>`<div class="card row"><div><strong>${esc(name)}</strong><div class="muted">${esc(active.name)} · Results not imported</div><a href="${base}/results?group=${encodeURIComponent(active.id)}" target="_blank" rel="noopener">Division ↗</a></div><button class="follow ${isFollowedExternal(active.id,name)?'on':''}" data-external="${esc(name)}">${isFollowedExternal(active.id,name)?'Following':'+ Follow'}</button></div>`).join('')||'<div class="card muted">No teams loaded. Add names when creating the division, or use the official WSSL directory.</div>'):'<div class="card muted">Add a division above to start following teams.</div>'}`;
 document.querySelector('#sex-filter').onchange=e=>{document.querySelector('#sex-filter').value=e.target.value;renderTeamsFor(e.target.value,null,'')};
 document.querySelector('#division-filter').onchange=e=>renderTeamsFor(sex,e.target.value,'');
 document.querySelector('#search').oninput=e=>renderTeamsFor(sex,active?.id,e.target.value);
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const i=+b.dataset.id;fav=fav.includes(i)?fav.filter(n=>n!==i):[...fav,i];save();renderTeamsFor(sex,active.id,document.querySelector('#search').value);renderScores()});
 document.querySelectorAll('[data-external]').forEach(b=>b.onclick=()=>{const name=b.dataset.external;let arr=getExtraTeams();arr=isFollowedExternal(active.id,name)?arr.filter(t=>!(t.divisionId===active.id&&t.name===name)):[...arr,{divisionId:active.id,name,division:active.name}];saveExtraTeams(arr);renderTeamsFor(sex,active.id,document.querySelector('#search').value);renderScores()});
 document.querySelector('#add-division').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=String(f.get('url'));let u;try{u=new URL(url)}catch{return};const m=u.pathname.match(/^\/org_event\/events\/(\d+)\/results\/?$/),id=u.searchParams.get('group');if(u.hostname!=='system.gotsport.com'||!m||m[1]!==d.eventId||!/^\d+$/.test(id||'')){document.querySelector('#form-message').textContent='Use a results?group=... link from WSSL event 56299.';return}const existing=getExtraDivisions();const division={id,name:String(f.get('name')).trim(),sex:String(f.get('sex')),teams:[...new Set(String(f.get('teams')).split('\n').map(x=>x.trim()).filter(Boolean))]};localStorage.setItem(CATALOG_KEY,JSON.stringify([...existing.filter(x=>x.id!==id),division]));renderTeamsFor(division.sex,id,'')};
}
function renderTeamsFor(sex,id,q){filterSex=sex;filterDivision=id||'';renderTeams(q)}
function renderSettings(){let settings=JSON.parse(localStorage.getItem('sw-settings')||'{"final":true,"schedule":true,"push":true,"sms":false}');document.querySelector('#settings').innerHTML='<h2>Alert Preferences</h2><div class="card">'+[['final','New posted scores'],['schedule','Schedule changes'],['push','iPhone push notifications'],['sms','SMS notifications']].map(([key,label])=>`<label>${label}<input type="checkbox" data-key="${key}" ${settings[key]?'checked':''}></label>`).join('')+'<small>These settings save on this device. No alerts are sent yet. Push/SMS requires a deployed service and permitted ongoing data access.</small></div>';document.querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{settings[el.dataset.key]=el.checked;localStorage.setItem('sw-settings',JSON.stringify(settings))})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['scores','teams','settings'].forEach(id=>document.getElementById(id).hidden=id!==b.dataset.tab)});renderScores();renderTeams();renderSettings();</script></body></html>
